<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>You're on the list — FormRight</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Outfit:wght@400;500;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --paper: #F3EEE2;
    --paper-white: #FAF7EF;
    --ink: #14213D;
    --ink-faint: #5B6478;
    --stamp: #A8351D;
    --rule: #D8CFB8;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: var(--paper); color: var(--ink);
    font-family: 'Outfit', system-ui, sans-serif; text-align: center; padding: 24px;
  }
  .serif { font-family: 'Fraunces', Georgia, serif; }
  main { max-width: 480px; }
  .brand { font-family: 'Fraunces', Georgia, serif; font-weight: 600; font-size: 1.1rem; margin-bottom: 32px; }
  h1 { font-size: clamp(1.8rem, 4vw, 2.4rem); margin: 0 0 16px; }
  p { color: var(--ink-faint); line-height: 1.6; }
  a { color: var(--stamp); font-weight: 700; text-decoration: none; }
  a:hover { text-decoration: underline; }
</style>
</head>
<body>
<main>
  <div class="brand">Form&middot;Right</div>
  <h1 class="serif">You're on the list.</h1>
  <p>We'll email you the moment FormRight launches — no spam before then.</p>
  <p><a href="/">&larr; Back to the homepage</a></p>
</main>
</body>
</html>
