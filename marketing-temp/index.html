<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FormRight — Coming Soon</title>
<meta name="description" content="FormRight: business formation for every founder. Launching soon.">
<style>
  :root {
    color-scheme: light dark;
    --bg: #0b0f1a;
    --fg: #f5f6fa;
    --muted: #9aa3b2;
    --accent: #5b8cff;
  }
  @media (prefers-color-scheme: light) {
    :root { --bg: #f5f6fa; --fg: #0b0f1a; --muted: #5b6472; --accent: #3660d6; }
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
  }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 24px;
  }
  main {
    max-width: 560px;
  }
  .mark {
    font-size: 1.1rem;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 24px;
  }
  h1 {
    font-size: clamp(2rem, 5vw, 3rem);
    line-height: 1.15;
    margin: 0 0 16px;
  }
  p {
    color: var(--muted);
    font-size: 1.05rem;
    line-height: 1.6;
    margin: 0 0 8px;
  }
  .eta {
    display: inline-block;
    margin-top: 24px;
    padding: 8px 18px;
    border: 1px solid var(--accent);
    border-radius: 999px;
    color: var(--accent);
    font-size: 0.9rem;
    font-weight: 600;
  }
</style>
</head>
<body>
<main>
  <div class="mark">FormRight</div>
  <h1>Business formation, done right.</h1>
  <p>LLCs, C-Corps, S-Corps, Nonprofits, Benefit Corps, Professional Corps, and Sole
    Proprietorships — one guided flow, real filings, no guesswork.</p>
  <p>We're putting the finishing touches on things.</p>
  <span class="eta">Launching soon</span>
</main>
</body>
</html>
